name: Release

on:
  push:
    tags:
    - 'v[0-9]*'

jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'
    - name: Setup poetry
      run: python3 -m pip install poetry
    - name: Install dependencies
      run: python3 -m poetry install
    - name: Run tests
      run: make test

  # Build linux_x86_64 on Amazon Linux 2023 (glibc 2.34) so the binary runs on
  # Vercel and other hosts older than Ubuntu 22.04 (glibc 2.35).
  package-linux:
    runs-on: ubuntu-latest
    container: amazonlinux:2023
    steps:
    - name: Install packaging dependencies
      run: |
        dnf install -y git tar gzip findutils which make zip binutils \
          gcc gcc-c++ zlib-devel python3.11 python3.11-pip python3.11-devel
        python3.11 -m pip install --upgrade pip
        python3.11 -m pip install poetry
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Show glibc version
      run: ldd --version | head -1
    - name: Install dependencies
      run: |
        poetry env use python3.11
        poetry install
    - name: Build package
      id: build_package
      run: make package
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: package-linux
        path: dist/${{ steps.build_package.outputs.package_filename }}

  package-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'
    - name: Setup poetry
      run: python3 -m pip install poetry
    - name: Install dependencies
      run: python3 -m poetry install
    - name: Build package
      id: build_package
      run: make package
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: package-macos
        path: dist/${{ steps.build_package.outputs.package_filename }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package-linux, package-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: package-*
          merge-multiple: true
      - name: Get environment
        id: environment
        run: |
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "tag_name=$(echo ${{ github.ref }} | cut -d / -f 3)" >> $GITHUB_OUTPUT
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@2c591bcc8ecdcd2db72b97d6147f871fcd833ba5
        with:
          tag: ${{ steps.environment.outputs.tag_name }}
          name: "Release: [${{ steps.environment.outputs.tag_name }}] - ${{ steps.environment.outputs.date }}"
          artifacts: "packages/*.zip"
          artifactContentType: "application/zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
